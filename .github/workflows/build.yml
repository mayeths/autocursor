name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AutoCursor
        run: ./build-app.sh
      - name: Zip app
        run: ditto -c -k --keepParent "$HOME/Desktop/AutoCursor.app" AutoCursor.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCursor
          path: AutoCursor.app.zip
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AutoCursor.app.zip --title "Latest build" --notes "Built from ${{ github.sha }}"
